<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Market Real-Time Data Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        font-weight: bold;
      }
      .connected {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .disconnected {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .stock-data {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }
      .stock-card {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        border-left: 4px solid #007bff;
      }
      .stock-card h3 {
        margin: 0 0 10px 0;
        color: #333;
      }
      .price {
        font-size: 1.5em;
        font-weight: bold;
        color: #007bff;
      }
      .change {
        margin: 5px 0;
      }
      .positive {
        color: #28a745;
      }
      .negative {
        color: #dc3545;
      }
      .controls {
        margin: 20px 0;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .logs {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 5px;
        margin-top: 20px;
        max-height: 300px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Stock Market Real-Time Data Test</h1>

      <div id="connectionStatus" class="status disconnected">
        📡 Disconnected from WebSocket
      </div>

      <div class="controls">
        <button onclick="connectWebSocket()">Connect</button>
        <button onclick="disconnectWebSocket()">Disconnect</button>
        <button onclick="subscribeToStocks()">Subscribe to Stocks</button>
        <button onclick="getPrice('RELIANCE.NS')">Get RELIANCE Price</button>
        <button onclick="clearLogs()">Clear Logs</button>
      </div>

      <div class="stock-data" id="stockData">
        <!-- Stock cards will be populated here -->
      </div>

      <div class="logs" id="logs"><strong>WebSocket Logs:</strong><br /></div>
    </div>

    <script>
      let ws = null;
      let isConnected = false;
      const stockData = {};

      function log(message) {
        const logs = document.getElementById("logs");
        const timestamp = new Date().toLocaleTimeString();
        logs.innerHTML += `[${timestamp}] ${message}<br>`;
        logs.scrollTop = logs.scrollHeight;
        console.log(message);
      }

      function updateConnectionStatus(connected) {
        const statusElement = document.getElementById("connectionStatus");
        isConnected = connected;

        if (connected) {
          statusElement.className = "status connected";
          statusElement.innerHTML = "✅ Connected to WebSocket";
        } else {
          statusElement.className = "status disconnected";
          statusElement.innerHTML = "❌ Disconnected from WebSocket";
        }
      }

      function connectWebSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          log("Already connected to WebSocket");
          return;
        }

        log("Connecting to WebSocket server...");
        ws = new WebSocket("ws://localhost:5000/ws");

        ws.onopen = function (event) {
          log("✅ WebSocket connected successfully");
          updateConnectionStatus(true);
        };

        ws.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            log(`📨 Received: ${data.type} - ${JSON.stringify(data, null, 2)}`);

            switch (data.type) {
              case "connected":
                log(`🎉 Connection confirmed: ${data.message}`);
                break;

              case "price_update":
                updateStockCard(data);
                break;

              case "market_status":
                log(`📊 Market Status: ${data.isOpen ? "Open" : "Closed"}`);
                break;

              case "subscribed":
                log(`📊 Subscribed to: ${data.symbols.join(", ")}`);
                break;

              case "error":
                log(`❌ Error: ${data.message}`);
                break;
            }
          } catch (error) {
            log(`❌ Error parsing message: ${error.message}`);
          }
        };

        ws.onclose = function (event) {
          log(`🔌 WebSocket connection closed: ${event.code} ${event.reason}`);
          updateConnectionStatus(false);
        };

        ws.onerror = function (error) {
          log(`❌ WebSocket error: ${error.message || "Unknown error"}`);
        };
      }

      function disconnectWebSocket() {
        if (ws) {
          ws.close();
          ws = null;
          log("🔌 Disconnected from WebSocket");
          updateConnectionStatus(false);
        }
      }

      function subscribeToStocks() {
        if (!isConnected) {
          log("⚠️ Not connected to WebSocket");
          return;
        }

        const symbols = [
          "RELIANCE.NS",
          "TCS.NS",
          "INFY.NS",
          "HDFCBANK.NS",
          "ITC.NS",
        ];
        const message = {
          type: "subscribe",
          symbols: symbols,
        };

        ws.send(JSON.stringify(message));
        log(`📊 Subscribing to: ${symbols.join(", ")}`);
      }

      function getPrice(symbol) {
        if (!isConnected) {
          log("⚠️ Not connected to WebSocket");
          return;
        }

        const message = {
          type: "get_price",
          symbol: symbol,
        };

        ws.send(JSON.stringify(message));
        log(`💰 Requesting price for: ${symbol}`);
      }

      function updateStockCard(data) {
        const symbol = data.symbol;
        const priceData = data.data;

        stockData[symbol] = priceData;

        const stockDataContainer = document.getElementById("stockData");

        // Create or update stock card
        let stockCard = document.getElementById(`stock-${symbol}`);
        if (!stockCard) {
          stockCard = document.createElement("div");
          stockCard.id = `stock-${symbol}`;
          stockCard.className = "stock-card";
          stockDataContainer.appendChild(stockCard);
        }

        const changeClass = priceData.change >= 0 ? "positive" : "negative";
        const changeSymbol = priceData.change >= 0 ? "+" : "";

        stockCard.innerHTML = `
                <h3>${symbol}</h3>
                <div class="price">₹${
                  priceData.price ? priceData.price.toFixed(2) : "N/A"
                }</div>
                <div class="change ${changeClass}">
                    ${changeSymbol}${
          priceData.change ? priceData.change.toFixed(2) : "0.00"
        } 
                    (${changeSymbol}${
          priceData.changePercent ? priceData.changePercent.toFixed(2) : "0.00"
        }%)
                </div>
                <div><strong>Previous Close:</strong> ₹${
                  priceData.previousClose
                    ? priceData.previousClose.toFixed(2)
                    : "N/A"
                }</div>
                <div><strong>Day High:</strong> ₹${
                  priceData.dayHigh ? priceData.dayHigh.toFixed(2) : "N/A"
                }</div>
                <div><strong>Day Low:</strong> ₹${
                  priceData.dayLow ? priceData.dayLow.toFixed(2) : "N/A"
                }</div>
                <div><strong>Volume:</strong> ${
                  priceData.volume ? priceData.volume.toLocaleString() : "N/A"
                }</div>
                <div><strong>Market State:</strong> ${
                  priceData.marketState || "N/A"
                }</div>
                <div><strong>Last Updated:</strong> ${new Date(
                  data.timestamp
                ).toLocaleTimeString()}</div>
            `;
      }

      function clearLogs() {
        document.getElementById("logs").innerHTML =
          "<strong>WebSocket Logs:</strong><br>";
      }

      // Auto-connect on page load
      document.addEventListener("DOMContentLoaded", function () {
        log("Page loaded. Ready to connect to WebSocket server.");
        log("Backend server should be running on http://localhost:5000");
        log("WebSocket endpoint: ws://localhost:5000/ws");
      });
    </script>
  </body>
</html>
